
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Manage Products</h4>
  <button class="btn btn-success" (click)="addNew()">+ Add Product</button>
</div>
<table class="table table-hover">
  <thead class="table-light">
    <tr><th>Name</th><th>Description</th><th>Price</th><th>Qty</th><th></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of products">
      <td>{{p.name}}</td>
      <td class="text-truncate" style="max-width:360px">{{p.description}}</td>
      <td>{{p.price | currency}}</td>
      <td>{{p.quantity}}</td>
      <td class="text-end">
        <button class="btn btn-sm btn-outline-primary me-2" (click)="edit(p)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="remove(p)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
