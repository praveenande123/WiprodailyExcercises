
<h4 class="mb-3">Products</h4>
<div class="row g-3">
  <div class="col-md-6" *ngFor="let p of products">
    <div class="card card-shadow p-3 h-100">
      <h5>{{p.name}}</h5>
      <p class="text-muted small">{{p.description}}</p>
      <div class="d-flex justify-content-between align-items-center">
        <div class="fs-5">{{p.price | currency}}</div>
        <div class="d-flex align-items-center gap-2">
          <input type="number" min="1" class="form-control" style="width:90px" [(ngModel)]="qty[p.id]">
          <button class="btn btn-outline-primary" (click)="add(p)" [disabled]="!auth.isCustomer()">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>
